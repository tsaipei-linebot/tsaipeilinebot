name: Deploy to Cloud Run

# 合併到 main 分支後，自動把最新的程式碼部署到 Cloud Run（recruitment-bot）。
# 不使用長期存放的金鑰，而是用 GCP 的 Workload Identity Federation
# 讓 GitHub 用「臨時身分」登入 GCP，安全性比存密鑰高。
#
# 一次性 GCP 設定（Workload Identity Pool / Provider / 部署用服務帳號）
# 已依 HANDOFF.md「CI/CD 自動部署」章節的指令完成。

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: tsaipei-505807
  REGION: asia-east1
  SERVICE: recruitment-bot
  WORKLOAD_IDENTITY_PROVIDER: projects/412901869672/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  SERVICE_ACCOUNT: github-actions-deployer@tsaipei-505807.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 下面「判斷這次改了哪些檔案」那一步要跟前一個 commit 比對
          # （git diff HEAD~1 HEAD），預設的淺層 clone（depth 1）沒有
          # 前一個 commit 可以比，要多抓一層歷史紀錄。
          fetch-depth: 2

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --source . \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --quiet

      # 系統更新自動公告（2026-09-19 新增，見 platform_announcements.py
      # 開頭的說明）：部署成功後，用這次合併的 commit 訊息（就是 PR
      # 標題＋內文，已經是給人看的中文說明）自動在 /portal 發一則公告，
      # 不用每次都手動打字。「少凱業務開發專區」（salesdev）相關的異動
      # 不列入公告——先看這次改了哪些檔案，如果全部都是 salesdev 相關
      # 檔案（含 HANDOFF.md，因為每次改動都會更新這份文件，不能因為它
      # 也改了就誤判成「不是純 salesdev 改動」），就跳過不發公告。這一步
      # 失敗不影響部署本身有沒有成功（部署那一步已經跑完了），只是不會
      # 有公告而已。
      - name: Auto-publish announcement (skip salesdev-only changes)
        if: success()
        continue-on-error: true
        env:
          AUTO_ANNOUNCE_SECRET: ${{ secrets.AUTO_ANNOUNCE_SECRET }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$AUTO_ANNOUNCE_SECRET" ]; then
            echo "沒有設定 AUTO_ANNOUNCE_SECRET 這個 GitHub Actions 密鑰，跳過自動公告。"
            exit 0
          fi

          # 【修正】原本用 SALESDEV_ONLY（預設 true，找到非排除檔案才設成
          # false）判斷要不要跳過，訊息卻寫死「只跟少凱業務開發專區有關」——
          # 如果這次唯一改到的檔案是 HANDOFF.md（例如純文件補充，像這次
          # 這個 PR 本身），迴圈整輪都不會把它設成 false，會被印成「只跟
          # 業務開發專區有關」，但其實根本沒有業務開發專區的異動，訊息
          # 誤導。改用 HAS_ANNOUNCEABLE_CHANGE（預設 false，找到非排除
          # 檔案才設成 true）名符其實地描述「有沒有找到值得公告的異動」，
          # 跳過的條件本身不變。
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD || true)
          HAS_ANNOUNCEABLE_CHANGE=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if [ "$f" = "HANDOFF.md" ]; then
              continue
            fi
            case "$f" in
              *salesdev*) continue ;;
              *) HAS_ANNOUNCEABLE_CHANGE=true ;;
            esac
          done <<< "$CHANGED_FILES"

          if [ "$HAS_ANNOUNCEABLE_CHANGE" != "true" ]; then
            echo "這次改動只有 HANDOFF.md 跟／或少凱業務開發專區相關檔案，沒有其他需要公告的異動，跳過自動公告。"
            exit 0
          fi

          TITLE=$(printf '%s\n' "$COMMIT_MSG" | head -1 | sed -E 's/ \(#[0-9]+\)$//')
          CONTENT=$(printf '%s\n' "$COMMIT_MSG" | tail -n +2 | grep -v '^Claude-Session:' | grep -v '^Co-authored-by:' | sed -e '/./,$!d')

          curl -sS -X POST \
            "https://recruitment-bot-412901869672.asia-east1.run.app/internal/announcements/auto-publish" \
            -H "X-Auto-Announce-Secret: $AUTO_ANNOUNCE_SECRET" \
            --data-urlencode "title=$TITLE" \
            --data-urlencode "content=$CONTENT" \
            || echo "自動公告發送失敗，不影響剛才的部署結果。"

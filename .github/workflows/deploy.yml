name: Deploy to Cloud Run

# 合併到 main 分支後，自動把最新的程式碼部署到 Cloud Run（recruitment-bot）。
# 不使用長期存放的金鑰，而是用 GCP 的 Workload Identity Federation
# 讓 GitHub 用「臨時身分」登入 GCP，安全性比存密鑰高。
#
# 這個 workflow 需要先在 GCP 完成一次性設定（建立 Workload Identity Pool /
# Provider / 部署用服務帳號），設定步驟見 HANDOFF.md「CI/CD 自動部署」章節。

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: tsaipei-505807
  REGION: asia-east1
  SERVICE: recruitment-bot
  # TODO: 這裡的 PROJECT_NUMBER 要換成 GCP 設定步驟印出來的真實數字，
  # 目前是占位字串，設定完成前這個 workflow 還不能正常運作。
  WORKLOAD_IDENTITY_PROVIDER: projects/<PROJECT_NUMBER>/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  SERVICE_ACCOUNT: github-actions-deployer@tsaipei-505807.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --source . \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --quiet

{% extends "base.html" %}
{% block title %}{{ '編輯公司' if company else '新增公司' }} - 材霈有限公司{% endblock %}
{% block content %}
<h1 class="page-title">{{ '編輯公司：' + company.name if company else '新增公司' }}</h1>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

<form method="post" action="{{ '/companies/' + company.id + '/edit' if company and company.id else '/companies/new' }}" class="form-stack form-narrow">
    <label>簡稱{% if company and company.id %}（建立後不能修改）{% endif %}
        <input type="text" name="short_name" value="{{ company.short_name if company else '' }}" required
               {% if company and company.id %}readonly{% else %}autofocus{% endif %}>
    </label>
    <label>公司名稱
        <input type="text" name="name" value="{{ company.name if company else '' }}" required>
    </label>
    <label>公司名稱（英文，選填）
        <input type="text" name="name_en" value="{{ company.name_en if company else '' }}">
    </label>
    <label>負責人
        <input type="text" name="responsible_person" value="{{ company.responsible_person if company else '' }}">
    </label>
    <label>電話
        <input type="text" name="phone" value="{{ company.phone if company else '' }}">
    </label>
    <label>統一編號
        <input type="text" name="tax_id" value="{{ company.tax_id if company else '' }}" required>
    </label>
    <label>勞工保險證號（選填，之後補上即可）
        <input type="text" name="labor_insurance_no" value="{{ company.labor_insurance_no if company else '' }}">
    </label>
    <label>勞工保險證號檢查碼（選填）
        <input type="text" name="labor_insurance_check_code" value="{{ company.labor_insurance_check_code if company else '' }}" maxlength="1">
    </label>
    <label>勞退提繳單位編號（選填）
        <input type="text" name="pension_unit_no" value="{{ company.pension_unit_no if company else '' }}">
    </label>
    <label>備註
        <textarea name="note" rows="3">{{ company.note if company else '' }}</textarea>
    </label>

    <button type="submit" class="btn btn-primary">{{ '儲存' if company else '建立公司' }}</button>
</form>
<p class="back-link"><a href="/companies">&larr; 回公司管理</a></p>
{% endblock %}

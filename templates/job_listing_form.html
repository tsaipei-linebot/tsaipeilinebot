{% extends "base.html" %}
{# 可見的標籤選取元件（放在 <label> 裡面，靠 .form-stack label 的排版樣式）
   跟實際負責表單送出資料的 hidden <select multiple>，故意拆成兩個巨集、
   分開輸出（不是同一包一起塞進 <label> 裡）——瀏覽器對 <label> 有個原生
   行為：點擊 <label> 裡任何地方，都會「順便」對它裡面的表單控制項也
   補送一次 click 事件，就算那個控制項是 hidden 的也一樣。如果把
   hidden 的 <select> 也包在同一個 <label> 裡，點擊自訂選取框時就會
   多觸發一次 <select> 的 click，冒泡到 document 的「點擊外面就關閉
   選單」判斷會誤判成「點在元件外面」，選單開了又馬上被關掉，變成看起來
   完全點不開——這就是 2026-09-09 使用者實測回報「所有選單功能都是壞的」
   的真正原因，用 Playwright 實際載入畫面點擊才抓到。#}
{% macro multiselect_widget(key) %}
<div class="multiselect" data-field="{{ key }}">
    <div class="multiselect-box" id="box_{{ key }}" onclick="toggleDropdown('{{ key }}')">
        <div class="multiselect-tags" id="tags_{{ key }}"></div>
    </div>
    <div class="multiselect-menu" id="menu_{{ key }}" hidden></div>
</div>
{% endmacro %}
{% macro multiselect_native_select(key, options) %}
<select name="{{ key }}" id="native_{{ key }}" multiple hidden>
    {% for opt in options %}<option value="{{ opt }}">{{ opt }}</option>{% endfor %}
</select>
{% endmacro %}
{% block title %}職缺維護 - 材霈有限公司{% endblock %}
{% block content %}
<h1 class="page-title">職缺維護</h1>
<p class="hint">
    填好送出後，會直接轉給現有的核准流程處理：您的主管會收到 LINE 通知，系統也會自動幫忙潤飾對外文案。
    這裡不用等待、也不用重新整理查看——核准結果會反映在 Notion 職缺資料庫跟官網上。
</p>

{% if submitted %}
<p class="success">職缺已送出審核，已通知主管處理。</p>
{% endif %}
{% if submit_unknown %}
<p class="warning">
    這筆職缺很可能其實已經送出成功了，只是材霈平台這邊沒辦法確認職缺維護系統的回應
    （這是對方系統偶爾會出現的已知狀況）。請先用下方「維護既有職缺」搜尋看看這筆職缺有沒有出現，
    如果沒有看到才需要重新送出，避免不小心送出兩筆重複的職缺。
</p>
{% endif %}
{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

<div class="repayment-section">
    <div class="repayment-section-title">操作模式設定</div>
    <p class="hint" style="margin-top: 0;">新增全新職缺，或維護個人與轄下同仁之職缺（主管具修改權限）</p>
    <label style="display: inline-flex; align-items: center; gap: 6px; margin-right: 20px;">
        <input type="radio" name="jobModeRadio" value="create" checked onchange="onJobModeChange()"> 新增全新職缺
    </label>
    <label style="display: inline-flex; align-items: center; gap: 6px;">
        <input type="radio" name="jobModeRadio" value="update" onchange="onJobModeChange()"> 維護既有職缺
    </label>

    <div id="existing-job-search-box" hidden style="margin-top: 14px;">
        <label>搜尋既有職缺 *（顯示廠商名稱主要識別，已自動依權限篩選只顯示您能維護的職缺）
            <input type="text" id="job-search-input" list="job-datalist" placeholder="請輸入廠商名稱搜尋或選取..." autocomplete="off">
            <datalist id="job-datalist"></datalist>
        </label>
        <div style="margin-top: 10px; display: flex; flex-wrap: wrap; gap: 16px;">
            <label style="display: inline-flex; align-items: center; gap: 6px;">
                <input type="radio" name="updateActionType" value="active_update" checked> 內容更新（核准後狀態為「一週內有更新」）
            </label>
            <label style="display: inline-flex; align-items: center; gap: 6px;">
                <input type="radio" name="updateActionType" value="stop_recruiting"> 指定停招（核准後狀態為「停招」）
            </label>
        </div>
    </div>
</div>

<form method="post" action="/job-listings" enctype="multipart/form-data" id="job-listing-form" class="form-stack">
    <input type="hidden" name="mode" id="field-mode" value="create">
    <input type="hidden" name="page_id" id="field-page-id" value="">
    <input type="hidden" name="update_action" id="field-update-action" value="create">
    <input type="hidden" name="existing_image_url" id="field-existing-image-url" value="{{ form.existing_image_url or '' }}">

    <div class="repayment-section">
        <div class="repayment-section-title">一、基本與廠商資訊
            <span class="repayment-subtotal" id="publisher-badge" style="background: var(--bg); color: var(--muted);">刊登人：{{ user.name }}</span>
        </div>
        <div class="repayment-basic-grid">
            <label>申請送審同仁 *（目前登入者，鎖定不可更改）
                <div class="applicant-readonly">{{ user.name }}</div>
            </label>
            <label>系統廠商名稱 *
                <input type="text" name="vendor" value="{{ form.vendor or '' }}" placeholder="如：欣興電子-山鶯廠" required>
            </label>
            <label>廠商名稱（主要識別）*
                <input type="text" name="title" value="{{ form.title or '' }}" placeholder="如：製程技術員" required>
            </label>
            <label>職缺名稱(對內) *
                <input type="text" name="internal_title" value="{{ form.internal_title or '' }}" placeholder="如：【山鶯】製程技術員(日班)" required>
            </label>
            <label class="full-width">職缺名稱(對外) *
                <input type="text" name="external_title" value="{{ form.external_title or '' }}" placeholder="如：大廠高薪日班技術員/供宿/高錄取" required>
            </label>
            <div class="field-block">行業別 *（可複選，Notion 多選）{{ multiselect_widget('industry') }}</div>
            {{ multiselect_native_select('industry', industry_options) }}
            <div class="field-block">職務類別 *（可複選，Notion 多選）{{ multiselect_widget('category') }}</div>
            {{ multiselect_native_select('category', category_options) }}
        </div>
    </div>

    <div class="repayment-section">
        <div class="repayment-section-title">二、職務屬性與工作條件</div>
        <div class="repayment-basic-grid">
            <div class="field-block">全/兼職{{ multiselect_widget('job_type') }}</div>
            {{ multiselect_native_select('job_type', job_type_options) }}
            <div class="field-block">外籍生{{ multiselect_widget('foreign_student') }}</div>
            {{ multiselect_native_select('foreign_student', foreign_student_options) }}
            <div class="field-block">職缺週期 *（可複選）{{ multiselect_widget('job_cycle') }}</div>
            {{ multiselect_native_select('job_cycle', job_cycle_options) }}
            <label class="full-width">工作內容(對內) *
                <textarea name="internal_desc" rows="3" placeholder="內部專員招募備忘、機台操作規範..." required>{{ form.internal_desc or '' }}</textarea>
            </label>
            <label class="full-width">工作內容(對外) *
                <textarea name="external_desc" rows="3" placeholder="對外公開刊登文案、工作項目..." required>{{ form.external_desc or '' }}</textarea>
            </label>
        </div>
    </div>

    <div class="repayment-section">
        <div class="repayment-section-title">三、地點與負責所別</div>
        <div class="repayment-basic-grid">
            <div class="field-block">縣市 *（可複選，選了才會出現對應行政區）{{ multiselect_widget('city') }}</div>
            {{ multiselect_native_select('city', taiwan_cities) }}
            <div class="field-block">行政區 *（可複選，含縣市名稱，可搜尋）{{ multiselect_widget('district') }}</div>
            {{ multiselect_native_select('district', []) }}
            <div class="field-block">負責所別{{ multiselect_widget('branch') }}</div>
            {{ multiselect_native_select('branch', branch_options) }}
        </div>
    </div>

    <div class="repayment-section">
        <div class="repayment-section-title">四、班別、薪酬與面試安排</div>
        <div class="repayment-basic-grid">
            <div class="field-block">班別{{ multiselect_widget('shift') }}</div>
            {{ multiselect_native_select('shift', shift_options) }}
            <div class="field-block">休假方式{{ multiselect_widget('leave_type') }}</div>
            {{ multiselect_native_select('leave_type', leave_type_options) }}
            <label>薪資待遇 *
                <input type="text" name="salary" value="{{ form.salary or '' }}" placeholder="如：月薪 38,000~45,000 / 時薪 210" required>
            </label>
            <div class="field-block">領薪方式{{ multiselect_widget('pay_method') }}</div>
            {{ multiselect_native_select('pay_method', pay_method_options) }}
            <label>面試方式 *
                <input type="text" name="interview_method" value="{{ form.interview_method or '' }}" placeholder="如：線上視訊面試 / 廠區面談" required>
            </label>
            <label>備註說明（選填）
                <input type="text" name="notes" value="{{ form.notes or '' }}" placeholder="如：供宿舍、免費供餐、介紹獎金">
            </label>
        </div>
    </div>

    <div class="repayment-section">
        <div class="repayment-section-title">五、職缺圖檔上傳（選填）</div>
        <div class="upload-row">
            <label class="upload-zone" id="job-upload-zone">
                <input type="file" name="image" accept="image/png,image/jpeg" id="job-image-input" hidden>
                <span class="upload-zone-icon">⬆</span>
                <span><strong>點擊選取圖片</strong> 或拖曳至此</span>
                <span>PNG, JPG, JPEG（將自動縮小為最佳尺寸）</span>
            </label>
            <div class="upload-preview" id="job-upload-preview">尚未選取圖檔</div>
        </div>
    </div>

    <button type="submit" class="btn btn-primary btn-block" id="job-listing-submit-btn">送出審核（同步推播主管群與群組）</button>
</form>
<p class="back-link"><a href="/portal">&larr; 回內部系統入口</a></p>

<script>
var TAIWAN_CITY_DISTRICTS = {{ taiwan_city_districts | tojson }};
var INITIAL_FORM = {{ form | tojson }};
var cachedJobs = [];
var districtFilterKeyword = '';

// FIELD_OPTIONS 是每個多選欄位目前「可以選的完整清單」；district 一開始
//是空的，選了縣市之後才會由 onCitySelectionChanged() 填入，跟現有表單
// 的 NOTION_OPTIONS.district 做法一致。
var FIELD_OPTIONS = {
    industry: {{ industry_options | tojson }},
    category: {{ category_options | tojson }},
    job_type: {{ job_type_options | tojson }},
    foreign_student: {{ foreign_student_options | tojson }},
    job_cycle: {{ job_cycle_options | tojson }},
    city: {{ taiwan_cities | tojson }},
    district: [],
    branch: {{ branch_options | tojson }},
    shift: {{ shift_options | tojson }},
    leave_type: {{ leave_type_options | tojson }},
    pay_method: {{ pay_method_options | tojson }}
};

var selectedValues = {
    industry: INITIAL_FORM.industry || [],
    category: INITIAL_FORM.category || [],
    job_type: INITIAL_FORM.job_type || [],
    foreign_student: INITIAL_FORM.foreign_student || [],
    job_cycle: INITIAL_FORM.job_cycle || [],
    city: INITIAL_FORM.city || [],
    district: INITIAL_FORM.district || [],
    branch: INITIAL_FORM.branch || [],
    shift: INITIAL_FORM.shift || [],
    leave_type: INITIAL_FORM.leave_type || [],
    pay_method: INITIAL_FORM.pay_method || []
};

function escapeHtml(text) {
    return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}
function escapeJs(text) {
    return String(text).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
}

function closeAllDropdowns() {
    document.querySelectorAll('.multiselect-menu').forEach(function (el) { el.hidden = true; });
}
document.addEventListener('click', function (e) {
    if (!e.target.closest('.multiselect')) closeAllDropdowns();
});

function toggleDropdown(key) {
    var menu = document.getElementById('menu_' + key);
    if (key === 'district' && FIELD_OPTIONS.district.length === 0) return;
    var wasHidden = menu.hidden;
    closeAllDropdowns();
    if (wasHidden) {
        menu.hidden = false;
        if (key === 'district') {
            districtFilterKeyword = '';
            renderMenu('district');
            setTimeout(function () {
                var input = document.getElementById('district-search-input');
                if (input) { input.value = ''; input.focus(); }
            }, 30);
        }
    }
}

function syncNativeSelect(key) {
    var select = document.getElementById('native_' + key);
    var valueSet = new Set(selectedValues[key] || []);
    Array.from(select.options).forEach(function (o) { o.selected = valueSet.has(o.value); });
}

function renderTags(key) {
    var container = document.getElementById('tags_' + key);
    var cur = selectedValues[key] || [];
    if (cur.length === 0) {
        var placeholder = (key === 'district' && (selectedValues.city || []).length === 0) ? '請先選擇縣市...' : '請點選以選擇...';
        container.innerHTML = '<span class="multiselect-placeholder">' + placeholder + '</span>';
        return;
    }
    container.innerHTML = cur.map(function (val) {
        return '<span class="multiselect-tag">' + escapeHtml(val) +
            '<button type="button" onclick="removeTag(\'' + key + '\', \'' + escapeJs(val) + '\', event)">&times;</button></span>';
    }).join('');
}

function renderMenu(key) {
    var menu = document.getElementById('menu_' + key);
    var options = FIELD_OPTIONS[key] || [];
    var cur = selectedValues[key] || [];

    if (key === 'district') {
        if (options.length === 0) {
            menu.innerHTML = '<div class="multiselect-empty">請先選擇縣市以載入行政區</div>';
            return;
        }
        menu.innerHTML =
            '<div class="multiselect-menu-header">' +
            '<input type="text" id="district-search-input" placeholder="搜尋行政區 (如：新莊、板橋)..." value="' + escapeHtml(districtFilterKeyword) + '" onclick="event.stopPropagation()">' +
            '<div class="multiselect-menu-controls"><span id="district-count-display"></span>' +
            '<span><button type="button" onclick="selectAllOptions(\'district\', event)">全選</button>' +
            '<button type="button" onclick="clearAllOptions(\'district\', event)">清除</button></span></div></div>' +
            '<div id="district-options-container"></div>';
        var input = document.getElementById('district-search-input');
        input.addEventListener('input', function (e) {
            districtFilterKeyword = e.target.value.trim().toLowerCase();
            renderDistrictOptions();
        });
        renderDistrictOptions();
        return;
    }

    if (options.length === 0) {
        menu.innerHTML = '<div class="multiselect-empty">無可用選項</div>';
        return;
    }
    menu.innerHTML = options.map(function (opt) {
        var isSelected = cur.indexOf(opt) > -1;
        return '<div class="multiselect-option' + (isSelected ? ' selected' : '') + '" onclick="toggleOption(\'' + key + '\', \'' + escapeJs(opt) + '\')">' +
            '<span>' + escapeHtml(opt) + '</span>' + (isSelected ? '<span>&check;</span>' : '') + '</div>';
    }).join('');
}

function renderDistrictOptions() {
    var container = document.getElementById('district-options-container');
    if (!container) return;
    var options = FIELD_OPTIONS.district || [];
    var cur = selectedValues.district || [];
    var display = options;
    if (districtFilterKeyword) {
        display = options.filter(function (o) { return o.toLowerCase().indexOf(districtFilterKeyword) > -1; });
    }
    var countEl = document.getElementById('district-count-display');
    if (countEl) countEl.textContent = '已選 ' + cur.length + ' / 共 ' + options.length + ' 個';
    if (display.length === 0) {
        container.innerHTML = '<div class="multiselect-empty">查無符合搜尋條件的項目</div>';
        return;
    }
    container.innerHTML = display.map(function (opt) {
        var isSelected = cur.indexOf(opt) > -1;
        return '<div class="multiselect-option' + (isSelected ? ' selected' : '') + '" onclick="toggleOption(\'district\', \'' + escapeJs(opt) + '\')">' +
            '<span>' + escapeHtml(opt) + '</span>' + (isSelected ? '<span>&check;</span>' : '') + '</div>';
    }).join('');
}

function toggleOption(key, val) {
    var cur = selectedValues[key] || [];
    var idx = cur.indexOf(val);
    if (idx > -1) cur.splice(idx, 1); else cur.push(val);
    selectedValues[key] = cur;
    renderTags(key);
    if (key === 'district') { renderDistrictOptions(); } else { renderMenu(key); }
    syncNativeSelect(key);
    if (key === 'city') onCitySelectionChanged();
}

function removeTag(key, val, e) {
    if (e) e.stopPropagation();
    var cur = selectedValues[key] || [];
    var idx = cur.indexOf(val);
    if (idx > -1) {
        cur.splice(idx, 1);
        selectedValues[key] = cur;
        renderTags(key);
        if (key === 'district') { renderDistrictOptions(); } else { renderMenu(key); }
        syncNativeSelect(key);
        if (key === 'city') onCitySelectionChanged();
    }
}

function selectAllOptions(key, e) {
    if (e) e.stopPropagation();
    selectedValues[key] = (FIELD_OPTIONS[key] || []).slice();
    renderTags(key);
    if (key === 'district') renderDistrictOptions(); else renderMenu(key);
    syncNativeSelect(key);
}
function clearAllOptions(key, e) {
    if (e) e.stopPropagation();
    selectedValues[key] = [];
    renderTags(key);
    if (key === 'district') renderDistrictOptions(); else renderMenu(key);
    syncNativeSelect(key);
}

function setFieldValues(key, values) {
    selectedValues[key] = Array.isArray(values) ? values.slice() : (values ? [values] : []);
    renderTags(key);
    renderMenu(key);
    syncNativeSelect(key);
}

function onCitySelectionChanged() {
    var selectedCities = selectedValues.city || [];
    var available = [];
    var seen = {};
    selectedCities.forEach(function (city) {
        (TAIWAN_CITY_DISTRICTS[city] || []).forEach(function (d) {
            if (!seen[d]) { seen[d] = true; available.push(d); }
        });
    });
    FIELD_OPTIONS.district = available;
    selectedValues.district = (selectedValues.district || []).filter(function (d) { return available.indexOf(d) > -1; });

    // native_district 這個 hidden <select> 伺服器端渲染時是空的（行政區
    // 選項要看縣市選了什麼才知道，不是固定清單），syncNativeSelect() 只會
    // 切換「已經存在的」<option> 的 selected 屬性，不會自己生出新的
    // <option>——所以縣市一變動，這裡要重新生成 native_district 底下的
    // <option> 清單，不然行政區不管選了什麼，表單送出時永遠是空的。
    var nativeDistrictSelect = document.getElementById('native_district');
    nativeDistrictSelect.innerHTML = '';
    available.forEach(function (d) {
        var opt = document.createElement('option');
        opt.value = d;
        nativeDistrictSelect.appendChild(opt);
    });

    renderTags('district');
    renderMenu('district');
    syncNativeSelect('district');
    var box = document.getElementById('box_district');
    if (selectedCities.length === 0) { box.classList.add('disabled'); } else { box.classList.remove('disabled'); }
}

function onJobModeChange() {
    var mode = document.querySelector('input[name="jobModeRadio"]:checked').value;
    document.getElementById('field-mode').value = mode;
    document.getElementById('existing-job-search-box').hidden = (mode !== 'update');
    if (mode === 'create') {
        document.getElementById('field-page-id').value = '';
        document.getElementById('field-update-action').value = 'create';
        document.getElementById('publisher-badge').textContent = '刊登人：{{ user.name }}';
    }
}

document.querySelectorAll('input[name="updateActionType"]').forEach(function (r) {
    r.addEventListener('change', function () {
        document.getElementById('field-update-action').value = r.value;
    });
});

function loadMaintainableJobs() {
    fetch('/job-listings/api/jobs').then(function (r) { return r.json(); }).then(function (data) {
        cachedJobs = data.jobs || [];
        var datalist = document.getElementById('job-datalist');
        var input = document.getElementById('job-search-input');
        datalist.innerHTML = '';
        if (cachedJobs.length === 0) {
            input.placeholder = '您目前無可維護之職缺（需為原刊登人或其主管）';
            return;
        }
        input.placeholder = '請輸入廠商名稱搜尋 (可維護共 ' + cachedJobs.length + ' 筆)...';
        cachedJobs.forEach(function (j) {
            var opt = document.createElement('option');
            opt.value = j.title || j.label || '';
            datalist.appendChild(opt);
        });
    }).catch(function () {});
}

document.getElementById('job-search-input').addEventListener('input', function (e) {
    var val = e.target.value.trim();
    if (!val) return;
    var matched = cachedJobs.find(function (j) {
        return (j.title && j.title.trim() === val) || (j.internal_title && j.internal_title.trim() === val);
    });
    if (matched) populateJobForm(matched);
});

function populateJobForm(d) {
    document.getElementById('field-page-id').value = d.id || '';
    document.getElementById('field-existing-image-url').value = d.image_url || '';
    document.getElementById('publisher-badge').textContent = '刊登人：' + (d.publisher || '{{ user.name }}');

    document.querySelector('input[name="vendor"]').value = d.vendor || '';
    document.querySelector('input[name="title"]').value = d.title || '';
    document.querySelector('input[name="internal_title"]').value = d.internal_title || '';
    document.querySelector('input[name="external_title"]').value = d.external_title || '';
    document.querySelector('input[name="salary"]').value = d.salary || '';
    document.querySelector('input[name="interview_method"]').value = d.interview_method || '';
    document.querySelector('textarea[name="internal_desc"]').value = d.internal_desc || '';
    document.querySelector('textarea[name="external_desc"]').value = d.external_desc || '';
    document.querySelector('input[name="notes"]').value = d.notes || '';

    setFieldValues('industry', d.industry);
    setFieldValues('category', d.category);
    setFieldValues('job_type', d.job_type);
    setFieldValues('foreign_student', d.foreign_student);
    setFieldValues('job_cycle', d.job_cycle);
    setFieldValues('city', d.city);
    onCitySelectionChanged();
    setFieldValues('district', d.district);
    setFieldValues('branch', d.branch);
    setFieldValues('shift', d.shift);
    setFieldValues('leave_type', d.leave_type);
    setFieldValues('pay_method', d.pay_method);

    var preview = document.getElementById('job-upload-preview');
    if (d.image_url) {
        preview.innerHTML = '<img src="' + d.image_url + '" alt="既有圖檔">';
    } else {
        preview.textContent = '尚未選取圖檔';
    }
}

// 頁面載入時（含表單驗證失敗重新整理回來的情況）先把每個多選欄位的畫面
// 跟底下的原生 <select> 同步一次；行政區要等縣市的可選清單算出來之後
// 才能決定「目前選的這幾個行政區還算不算數」，所以放最後處理。
['industry', 'category', 'job_type', 'foreign_student', 'job_cycle', 'city', 'branch', 'shift', 'leave_type', 'pay_method'].forEach(function (key) {
    renderTags(key);
    renderMenu(key);
    syncNativeSelect(key);
});
onCitySelectionChanged();

loadMaintainableJobs();

(function () {
    var uploadZone = document.getElementById('job-upload-zone');
    var imageInput = document.getElementById('job-image-input');
    var preview = document.getElementById('job-upload-preview');

    function showPreview(file) {
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function (e) {
            preview.innerHTML = '<img src="' + e.target.result + '" alt="預覽">';
        };
        reader.readAsDataURL(file);
    }
    imageInput.addEventListener('change', function () { showPreview(imageInput.files[0]); });
    ['dragenter', 'dragover'].forEach(function (evt) {
        uploadZone.addEventListener(evt, function (e) { e.preventDefault(); uploadZone.classList.add('drag-over'); });
    });
    ['dragleave', 'drop'].forEach(function (evt) {
        uploadZone.addEventListener(evt, function (e) { e.preventDefault(); uploadZone.classList.remove('drag-over'); });
    });
    uploadZone.addEventListener('drop', function (e) {
        var file = e.dataTransfer.files[0];
        if (file) { imageInput.files = e.dataTransfer.files; showPreview(file); }
    });

    document.getElementById('job-listing-form').addEventListener('submit', function () {
        var btn = document.getElementById('job-listing-submit-btn');
        btn.disabled = true;
        btn.textContent = '送出中，請稍候…（可能需要幾秒鐘）';
    });
})();
</script>
{% endblock %}

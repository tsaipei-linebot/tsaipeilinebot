{% extends "base.html" %}
{% block title %}{{ '編輯帳號' if account else '新增帳號' }} - 材霈有限公司{% endblock %}
{% block content %}
<h1 class="page-title">{{ '編輯帳號：' + account.username if account else '新增帳號' }}</h1>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

<form method="post" action="{{ '/accounts/' + account.username + '/edit' if account else '/accounts/new' }}" class="form-stack form-narrow" id="account-form">
    {% if not account %}
    <label>帳號
        <input type="text" name="username" required autofocus>
    </label>
    {% endif %}
    <label>密碼{% if account %}（留空代表不修改）{% endif %}
        <input type="password" name="password" autocomplete="new-password" {% if not account %}required{% endif %}>
    </label>
    <label>姓名
        <input type="text" name="name" value="{{ account.name if account else '' }}" required>
    </label>
    <label>部門 *（「小雞點數自費申請」會直接帶入這裡選的部門；沒有想要的選項，先到「部門管理」新增）
        <select name="department" id="department" required>
            <option value="" {% if not (account and account.department) %}selected{% endif %}>請選擇...</option>
            {% for d in departments %}
            <option value="{{ d.name }}" {% if account and account.department == d.name %}selected{% endif %}>{{ d.name }}</option>
            {% endfor %}
            {% if account and account.department and account.department not in departments|map(attribute="name")|list %}
            <option value="{{ account.department }}" selected>{{ account.department }}（不在目前的部門清單裡，請重新選擇）</option>
            {% endif %}
        </select>
    </label>
    <label>職級 *（決定這個帳號在已開放的模組裡算不算管理權限，副主任含以上算管理權限）
        <select name="rank" required>
            <option value="" {% if not (account and account.rank) %}selected{% endif %}>請選擇...</option>
            {% for r in ranks %}
            <option value="{{ r.code }}" {% if account and account.rank == r.code %}selected{% endif %}>{{ r.name }}</option>
            {% endfor %}
        </select>
    </label>
    {# 這裡故意用 <div class="field-block"> 不用 <label> 包住下拉選單元件——
       瀏覽器對 <label> 有個原生行為：點擊 <label> 裡任何地方，都會「順便」
       對它裡面第一個可以當標籤對象的表單控制項補送一次 click，如果把下面
       這個隱藏的 <select multiple> 包在同一個 <label> 裡，點擊自訂下拉框
       時就會多觸發一次隱藏 <select> 的 click，冒泡到 document 的「點擊
       外面就關閉選單」判斷會誤判成「點在元件外面」，選單開了又馬上被關掉
       ——跟 templates/job_listing_form.html 的 multiselect_widget() 是同一個
       已經踩過的雷，做法照抄。 #}
    <div class="field-block">
        所屬主管（可複選，只列出職級主任、副主任、經理等主管級同仁；選好部門後會自動預帶這個部門目前的主管人選，仍可手動調整；沒有主管、或本身就是最高層級就不用選）
        <div class="multiselect" data-field="manager_usernames">
            <div class="multiselect-box" id="box_manager_usernames" onclick="toggleManagerDropdown()">
                <div class="multiselect-tags" id="tags_manager_usernames"></div>
            </div>
            <div class="multiselect-menu" id="menu_manager_usernames" hidden></div>
        </div>
    </div>
    <select name="manager_usernames" id="native_manager_usernames" multiple hidden>
        {% for m in manager_options %}
        <option value="{{ m.username }}" {% if account and m.username in account.manager_usernames %}selected{% endif %}>{{ m.name }}（{{ m.username }}）</option>
        {% endfor %}
    </select>

    <table class="data-table">
        <thead>
            <tr>
                <th>部門模組</th>
                <th>開放</th>
            </tr>
        </thead>
        <tbody>
            {% for m in modules %}
            <tr>
                <td>{{ m.name }}</td>
                <td>
                    <label style="display:inline-flex;align-items:center;gap:6px;margin:0;">
                        <input type="checkbox" name="module_{{ m.code }}" {% if account and m.code in account.modules %}checked{% endif %}>
                        開放
                    </label>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <button type="submit" class="btn btn-primary">{{ '儲存' if account else '建立帳號' }}</button>
</form>
<p class="back-link"><a href="/accounts">&larr; 回帳號權限管理</a></p>

<script>
// 「所屬主管」下拉式多選元件：可見的標籤選取框（.multiselect-box）跟
// 實際負責表單送出資料的隱藏 <select multiple id="native_manager_usernames">
// 分開處理，元件本身只是操作 selectedManagers 這個陣列，每次異動後才
// 同步回隱藏的 <select>——跟 job_listing_form.html 的多選元件是同一套
// 概念，但這裡只有單一欄位，不需要它那套多欄位共用的通用機制。
var MANAGER_OPTIONS = [
    {% for m in manager_options %}
    { value: {{ m.username | tojson }}, label: {{ (m.name + '（' + m.username + '）') | tojson }} }{{ "," if not loop.last }}
    {% endfor %}
];
var selectedManagers = Array.from(document.getElementById('native_manager_usernames').selectedOptions).map(function (o) { return o.value; });

function escapeHtmlManager(text) {
    var div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function syncNativeManagerSelect() {
    var select = document.getElementById('native_manager_usernames');
    var valueSet = new Set(selectedManagers);
    Array.from(select.options).forEach(function (o) { o.selected = valueSet.has(o.value); });
}

function renderManagerTags() {
    var container = document.getElementById('tags_manager_usernames');
    if (selectedManagers.length === 0) {
        container.innerHTML = '<span class="multiselect-placeholder">請點選以選擇...</span>';
        return;
    }
    var byValue = {};
    MANAGER_OPTIONS.forEach(function (o) { byValue[o.value] = o.label; });
    container.innerHTML = selectedManagers.map(function (val) {
        return '<span class="multiselect-tag">' + escapeHtmlManager(byValue[val] || val) + '</span>';
    }).join('');
}

function renderManagerMenu() {
    var menu = document.getElementById('menu_manager_usernames');
    if (MANAGER_OPTIONS.length === 0) {
        menu.innerHTML = '<div class="multiselect-empty">目前沒有職級副主任以上的同仁可以選</div>';
        return;
    }
    menu.innerHTML = MANAGER_OPTIONS.map(function (o) {
        var isSelected = selectedManagers.indexOf(o.value) > -1;
        return '<div class="multiselect-option' + (isSelected ? ' selected' : '') + '" onclick="toggleManagerOption(\'' + o.value + '\')">' +
            '<span>' + escapeHtmlManager(o.label) + '</span>' + (isSelected ? '<span>&check;</span>' : '') + '</div>';
    }).join('');
}

function toggleManagerOption(value) {
    managerTouched = true;
    var idx = selectedManagers.indexOf(value);
    if (idx > -1) selectedManagers.splice(idx, 1); else selectedManagers.push(value);
    renderManagerTags();
    renderManagerMenu();
    syncNativeManagerSelect();
}

function toggleManagerDropdown() {
    var menu = document.getElementById('menu_manager_usernames');
    var wasHidden = menu.hidden;
    menu.hidden = true;
    if (wasHidden) {
        renderManagerMenu();
        menu.hidden = false;
    }
}

document.addEventListener('click', function (e) {
    if (!e.target.closest('.multiselect')) {
        document.getElementById('menu_manager_usernames').hidden = true;
    }
});

renderManagerTags();

// 部門 -> 目前職級副主任以上的帳號清單，選了部門之後自動預帶進「所屬
// 主管」欄位——只是預帶，選好之後同仁還是可以手動調整/清空，不是強制
// 套用。只要「所屬主管」欄位還沒被手動動過，就會跟著部門選擇一起更新；
// 一旦手動選過（toggleManagerOption()），就不再自動覆蓋，避免蓋掉已經
// 手動調整過的結果。
var DEPARTMENT_MANAGERS = {{ department_managers | tojson }};
var managerTouched = false;
document.getElementById('department').addEventListener('change', function () {
    if (managerTouched) return;
    selectedManagers = (DEPARTMENT_MANAGERS[this.value] || []).slice();
    renderManagerTags();
    renderManagerMenu();
    syncNativeManagerSelect();
});
</script>
{% endblock %}

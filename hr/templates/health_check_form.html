{% extends "base.html" %}
{% block title %}新增體檢報告 - 材霈有限公司-人資專區{% endblock %}
{% block content %}
<h1 class="page-title">新增體檢報告</h1>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

<form method="post" action="/hr/health-checks/new" enctype="multipart/form-data" class="form-stack form-narrow">
    <label>姓名
        <input type="text" name="personnel_name" required>
    </label>
    <label>部門（選填）
        <input type="text" name="department">
    </label>
    <label>受檢日期
        <input type="date" name="check_date" required>
    </label>
    <label>下次應受檢日期（選填）
        <input type="date" name="next_due_date">
    </label>
    <label>備註（選填）
        <textarea name="note" rows="3"></textarea>
    </label>
    <label>體檢報告檔案（選填，PDF/圖片）
        <input type="file" name="file">
    </label>
    <button type="submit" class="btn btn-primary">建立</button>
</form>
<p class="back-link"><a href="/hr/health-checks">&larr; 回員工體檢報告</a></p>
{% endblock %}

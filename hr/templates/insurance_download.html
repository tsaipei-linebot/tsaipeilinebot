{% extends "base.html" %}
{% block title %}下載加退保彙總 - 材霈有限公司-人資專區{% endblock %}
{% block content %}
<h1 class="page-title">下載加退保彙總</h1>
<p class="hint">選一個日期區間（選同一天就是只下載那一天），系統會把這段期間各部門已上傳的資料整理成一份「全區域加退保紀錄表」格式的 Excel。投保單位/出生年月日/班次級距/招募人員這幾欄系統沒有資料來源，會是空白，下載後請自行補上。</p>

{% if error %}
<p class="error js-flash">{{ error }}</p>
{% endif %}

<form method="post" action="/hr/insurance/download" class="form-stack form-narrow">
    <label>起始日期
        <input type="date" name="start_date" value="{{ start_date }}" required>
    </label>
    <label>結束日期
        <input type="date" name="end_date" value="{{ end_date }}" required>
    </label>
    <button type="submit" class="btn btn-primary">下載</button>
</form>

<p class="back-link"><a href="/hr/insurance/summary">&larr; 回每日加退彙總</a></p>
{% endblock %}

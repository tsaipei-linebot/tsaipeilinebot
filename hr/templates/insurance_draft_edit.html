{% extends "base.html" %}
{% block title %}修改待送出資料 - 材霈有限公司-人資專區{% endblock %}
{% block content %}
<h1 class="page-title">修改待送出資料</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/hr/insurance/drafts/{{ draft.id }}/edit" class="form-stack form-narrow">
    <input type="hidden" name="work_date" value="{{ work_date }}">
    {% with d = draft %}{% include "_insurance_draft_fields.html" %}{% endwith %}
    <button type="submit" class="btn btn-primary">儲存</button>
</form>
<p class="back-link"><a href="/hr/insurance/upload{% if work_date %}?work_date={{ work_date }}{% endif %}">&larr; 回每日加退保</a></p>
{% endblock %}

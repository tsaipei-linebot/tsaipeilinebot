{% extends "base.html" %}
{% block title %}補款登記 - 材霈有限公司-配送部系統{% endblock %}
{% block content %}
<h1 class="page-title">補款登記</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/delivery/function/repayment" class="form-stack form-narrow">
    <label>廠商
        <select name="vendor" required>
            {% for v in vendors %}
            <option value="{{ v.code }}">{{ v.name }}</option>
            {% endfor %}
        </select>
    </label>
    <label>人員姓名
        <input type="text" name="personnel_name" required>
    </label>
    <label>補款金額
        <input type="number" name="amount" step="1" min="0" required>
    </label>
    <label>日期
        <input type="date" name="occurred_date" value="{{ today }}" required>
    </label>
    <label>原因說明
        <textarea name="reason" rows="3"></textarea>
    </label>
    <button type="submit" class="btn btn-primary">送出登記</button>
</form>

<p class="back-link"><a href="/delivery/function/repayment/records">查看補款記錄 &rarr;</a></p>
<p class="back-link"><a href="/delivery/">&larr; 回主頁</a></p>
{% endblock %}

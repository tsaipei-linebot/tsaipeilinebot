{% extends "base.html" %}
{% block title %}假別登記 - 材霈有限公司-配送部系統{% endblock %}
{% block content %}
<h1 class="page-title">假別登記</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/delivery/function/sick-leave" enctype="multipart/form-data" class="form-stack form-narrow">
    <label>廠商
        <select name="vendor" required>
            {% for v in vendors %}
            <option value="{{ v.code }}">{{ v.name }}</option>
            {% endfor %}
        </select>
    </label>
    <label>人員姓名
        <input type="text" name="personnel_name" required>
    </label>
    <label>假別
        <select name="leave_type" required>
            {% for t in leave_types %}
            <option value="{{ t.code }}">{{ t.name }}</option>
            {% endfor %}
        </select>
    </label>
    <label>開始日期
        <input type="date" name="start_date" value="{{ today }}" required>
    </label>
    <label>結束日期
        <input type="date" name="end_date" value="{{ today }}" required>
    </label>
    <label>原因說明
        <textarea name="reason" rows="3"></textarea>
    </label>
    <label>收據上傳（病假才需要，JPG/PNG/PDF，10MB 以內）
        <input type="file" name="receipt" accept="image/*,application/pdf">
    </label>
    <button type="submit" class="btn btn-primary">送出登記</button>
</form>

<p class="back-link"><a href="/delivery/function/sick-leave/records">查看假別查詢 &rarr;</a></p>
<p class="back-link"><a href="/delivery/">&larr; 回主頁</a></p>
{% endblock %}

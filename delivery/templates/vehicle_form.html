{% extends "base.html" %}
{% block title %}新增車輛 - 材霈有限公司-新北所(配送組)系統{% endblock %}
{% block container_class %}container-wide{% endblock %}
{% block content %}
<h1 class="page-title">新增車輛</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}

<form method="post" action="/delivery/vehicles/new" class="form-stack form-narrow">
    <label>車號
        <input type="text" name="vehicle_no" required>
    </label>
    <label>廠商
        <select name="vendor" required>
            {% for v in vendors %}
            <option value="{{ v.code }}">{{ v.name }}</option>
            {% endfor %}
        </select>
    </label>
    <label>輪別
        <select name="wheel_type" required>
            {% for w in wheel_types %}
            <option value="{{ w.code }}" {% if default_wheel_type == w.code %}selected{% endif %}>{{ w.name }}</option>
            {% endfor %}
        </select>
    </label>
    <label>服務區域
        <select name="service_area" required>
            <option value="">請選擇</option>
            {% for a in service_areas %}
            <option value="{{ a.id }}">{{ a.name }}</option>
            {% endfor %}
        </select>
    </label>
    <button type="submit" class="btn btn-primary">新增車輛</button>
</form>

<p class="back-link"><a href="/delivery/vehicles">&larr; 回車輛管理</a></p>
{% endblock %}

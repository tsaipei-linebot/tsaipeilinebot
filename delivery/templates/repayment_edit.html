{% extends "base.html" %}
{% block title %}編輯補款登記 - 材霈有限公司-新北所(配送組)系統{% endblock %}
{% block container_class %}container-wide{% endblock %}
{% block content %}
<h1 class="page-title">編輯補款登記：{{ record.personnel_name }}</h1>
{% if error %}<p class="error js-flash">{{ error }}</p>{% endif %}

<form method="post" action="/delivery/function/repayment/records/{{ record.id }}/edit" class="form-stack form-narrow">
    <label>廠商
        <select name="vendor" required>
            {% for v in vendors %}
            <option value="{{ v.code }}" {% if record.vendor == v.code %}selected{% endif %}>{{ v.name }}</option>
            {% endfor %}
        </select>
    </label>
    <label>人員姓名
        <input type="text" name="personnel_name" value="{{ record.personnel_name }}" required>
    </label>
    <label>補款金額
        <input type="number" name="amount" step="1" min="0" value="{{ record.amount }}" required>
    </label>
    <label>日期
        <input type="date" name="occurred_date" value="{{ record.occurred_date }}" required>
    </label>
    <label>原因說明
        <textarea name="reason" rows="3">{{ record.reason or '' }}</textarea>
    </label>
    <button type="submit" class="btn btn-primary">儲存修改</button>
</form>

<p class="back-link"><a href="/delivery/function/repayment/records">&larr; 回補款記錄</a></p>
{% endblock %}

{% extends "base.html" %}
{% block title %}新增人員 - {{ vendor_name }}{% endblock %}
{% block content %}
<h1 class="page-title">新增人員 - {{ vendor_name }}</h1>
<form method="post" action="/delivery/vendor/{{ vendor_code }}/new" class="form-stack form-narrow">
    <label>姓名
        <input type="text" name="name" required>
    </label>
    <label>身分證字號
        <input type="text" name="id_number">
    </label>
    <label>聯絡電話
        <input type="text" name="phone">
    </label>
    {% if show_cooperation_type %}
    <label>合作方式（可之後在人員詳細頁再設定）
        <select name="cooperation_type">
            <option value="">尚未決定</option>
            {% for c in cooperation_types %}
            <option value="{{ c.code }}">{{ c.name }}</option>
            {% endfor %}
        </select>
    </label>
    {% endif %}
    {% if show_client %}
    <label>負責客戶（可之後在人員詳細頁再設定）
        <select name="client">
            <option value="">尚未決定</option>
            {% for c in clients %}
            <option value="{{ c.code }}">{{ c.name }}</option>
            {% endfor %}
        </select>
    </label>
    {% endif %}
    <button type="submit" class="btn btn-primary">建立人員資料</button>
</form>
<p class="back-link"><a href="/delivery/vendor/{{ vendor_code }}">&larr; 回 {{ vendor_name }} 人員清單</a></p>
{% endblock %}

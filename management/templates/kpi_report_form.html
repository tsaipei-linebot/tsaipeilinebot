{% extends "base.html" %}
{% block title %}上傳業績報表 - 材霈有限公司-管理部{% endblock %}
{% block content %}
<h1 class="page-title">上傳業績報表</h1>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

<form method="post" action="/management/kpi-reports/new" enctype="multipart/form-data" class="form-stack form-narrow">
    <label>標題
        <input type="text" name="title" required>
    </label>
    <label>說明（選填）
        <textarea name="description" rows="4"></textarea>
    </label>
    <label>檔案（Excel/PDF/PPT/圖片）
        <input type="file" name="file" required>
    </label>
    <button type="submit" class="btn btn-primary">上傳</button>
</form>
<p class="back-link"><a href="/management/kpi-reports">&larr; 回業績報表庫</a></p>
{% endblock %}

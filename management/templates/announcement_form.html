{% extends "base.html" %}
{% block title %}發布公告 - 材霈有限公司-管理部{% endblock %}
{% block content %}
<h1 class="page-title">發布公告</h1>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

<form method="post" action="/management/announcements/new" class="form-stack form-narrow">
    <label>標題
        <input type="text" name="title" required>
    </label>
    <label>內容
        <textarea name="body" rows="8" required></textarea>
    </label>
    <button type="submit" class="btn btn-primary">發布</button>
</form>
<p class="back-link"><a href="/management/announcements">&larr; 回公告事項</a></p>
{% endblock %}

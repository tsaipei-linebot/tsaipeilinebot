{% extends "base.html" %}
{% block title %}新增會議記錄 - 材霈有限公司-管理部{% endblock %}
{% block content %}
<h1 class="page-title">新增會議記錄</h1>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

<form method="post" action="/management/meetings/new" enctype="multipart/form-data" class="form-stack form-narrow">
    <label>標題
        <input type="text" name="title" required>
    </label>
    <label>日期
        <input type="date" name="meeting_date" required>
    </label>
    <label>部門
        <input type="text" name="department" placeholder="例如：業務部" required>
    </label>
    <label>內容
        <textarea name="content" rows="10" required></textarea>
    </label>
    <label>附件（選填，PDF/PPT/Word/Excel/圖片）
        <input type="file" name="attachment">
    </label>
    <button type="submit" class="btn btn-primary">建立</button>
</form>
<p class="back-link"><a href="/management/meetings">&larr; 回會議記錄</a></p>
{% endblock %}

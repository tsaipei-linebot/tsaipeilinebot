<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>內部系統入口 - 材霈有限公司</title>
    <link rel="stylesheet" href="/delivery/static/style.css">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="/portal">
            <span class="brand-mark">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 7.5L12 3l9 4.5v9L12 21l-9-4.5v-9z"/>
                    <path d="M3 7.5L12 12l9-4.5"/>
                    <path d="M12 12v9"/>
                </svg>
            </span>
            材霈有限公司
        </a>
    </header>
    <main class="container">
        <div style="text-align: center; margin: 24px 0 32px;">
            <h1 class="page-title" style="margin-bottom: 8px;">內部系統入口</h1>
            <p class="hint" style="margin: 0;">請選擇要登入的系統</p>
        </div>

        <div class="home-grid">
            <a class="home-panel" href="/delivery/login" style="text-decoration: none; display: block;">
                <span class="home-panel-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 7.5L12 3l9 4.5v9L12 21l-9-4.5v-9z"/>
                        <path d="M3 7.5L12 12l9-4.5"/>
                        <path d="M12 12v9"/>
                    </svg>
                </span>
                <h2>配送部系統</h2>
                <p class="hint">廠商人員管理、應徵名單、補款假別、車輛與意外事件回報</p>
                <span style="color: var(--brand-dark); font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;">
                    前往登入
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                </span>
            </a>

            <a class="home-panel" href="https://ubiquitous-choux-38eefb.netlify.app/" style="text-decoration: none; display: block;">
                <span class="home-panel-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="7" width="20" height="14" rx="2"/>
                        <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
                        <path d="M2 13h20"/>
                    </svg>
                </span>
                <h2>職缺維護系統</h2>
                <p class="hint">開放招募、停招等職缺狀態維護，同步官網與招募機器人</p>
                <span style="color: var(--brand-dark); font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;">
                    前往登入
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                </span>
            </a>

            <div class="home-panel" style="opacity: 0.6; cursor: not-allowed; border-style: dashed; position: relative;">
                <span class="badge badge-pending" style="position: absolute; top: 18px; right: 18px;">即將推出</span>
                <span class="home-panel-icon" style="background: #eef0f2; color: var(--muted);">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
                </span>
                <h2 style="color: var(--muted);">更多部門系統</h2>
                <p class="hint" style="margin-bottom: 0;">未來新增的部門模組將顯示在這裡</p>
            </div>
        </div>
    </main>
</body>
</html>
